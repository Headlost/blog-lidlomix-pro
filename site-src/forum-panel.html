<dialog id="owner-panel" class="owner-panel" aria-labelledby="panel-title">
  <div class="panel-header">
    <h2 id="panel-title">Panel projektu</h2>
    <div class="panel-actions">
      <button type="button" id="panel-logout" class="panel-secondary" hidden>Wyloguj</button>
      <button type="button" id="panel-close">Zamknij</button>
    </div>
  </div>
  <form id="panel-login" class="blog-form" method="post">
    <p id="panel-preview-note" class="form-hint" hidden>Podgląd lokalny. Użyj hasła <strong>podglad</strong>, aby przetestować panel na lokalnych wpisach.</p>
    <label>Rola <select name="role"><option value="admin">Administrator</option><option value="moderator">Moderator</option></select></label>
    <input class="visually-hidden" name="username" value="Lidlomix Pro" autocomplete="username" tabindex="-1" aria-hidden="true" readonly>
    <label>Hasło <input type="password" name="password" autocomplete="current-password" maxlength="128" required></label>
    <button type="submit">Zaloguj się</button>
  </form>
  <p id="panel-status" role="status"></p>
  <div id="panel-area" hidden>
    <div class="panel-actions">
      <button type="button" data-panel-kind="pending">Do moderacji</button>
      <button type="button" data-panel-kind="published">Opublikowane</button>
      <button type="button" data-panel-kind="waitlist" class="panel-secondary" data-admin-only>Zapisy</button>
      <button type="button" data-panel-kind="hardware" class="panel-secondary" data-admin-only>Sprzęt</button>
      <button type="button" id="panel-releases-toggle" class="panel-secondary" data-admin-only>Aktualizacje</button>
    </div>
    <div id="panel-filters" class="panel-filters" hidden>
      <label>Język wpisu <select name="locale"><option value="">Wszystkie języki</option></select></label>
      <label>Dział forum <select name="board"><option value="">Wszystkie działy</option><!-- panel-boards --></select></label>
    </div>
    <div id="panel-entries" aria-live="polite"></div><button type="button" id="panel-more" hidden>Kolejna strona</button>
    <button type="button" id="panel-approval" class="panel-secondary" hidden></button>
    <form class="blog-form" id="panel-release" method="post" hidden>
      <h3>Opublikuj aktualizację</h3>
      <label>Wersja <input name="version" placeholder="0.15.1" inputmode="decimal" maxlength="14" pattern="[0-9]+\.[0-9]+\.[0-9]+" required></label>
      <label>Tytuł <input name="title" maxlength="100" required></label>
      <label>Co się zmieniło? <textarea name="body" minlength="10" maxlength="5000" rows="6" required></textarea></label>
      <p class="form-hint">Ponowna publikacja tej samej wersji zastępuje jej tytuł i opis.</p>
      <button type="submit">Opublikuj aktualizację</button>
    </form>
    <details id="panel-moderator" data-admin-only>
      <summary>Hasło moderatora</summary>
      <form class="blog-form" id="panel-roles" method="post">
        <label>Nowe hasło <input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
        <button type="submit">Zapisz hasło moderatora</button>
      </form>
    </details>
  </div>
</dialog>
<script src="panel.js?v=forum-boards-1" defer></script>
